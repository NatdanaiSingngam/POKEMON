<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#103039" />
  <title>ศึกยอดนักขาย — เกมกระดานโปเกมอน</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-ball">◉</span><div><strong>ศึกยอดนักขาย</strong><small>POKÉMON BOARD GAME · 3D</small></div></div>
      <div class="top-right"><span id="connection" class="connection">กำลังเชื่อมต่อ…</span><button id="roomBadge" class="room-badge" hidden></button></div>
    </header>
    <main class="layout">
      <section class="world-wrap"><div id="world" aria-label="กระดานสามมิติ"></div><div id="battleOverlay" aria-live="polite"></div><div id="playerHud" class="player-hud"></div><div id="worldFx" class="world-fx" aria-live="polite"></div><div class="world-caption">◈ ลากเพื่อหมุน · เลื่อนเพื่อซูม</div><div id="sceneMessage" class="scene-message">วนกระดาน 3 รอบ · ขายโปเกมอน · เงินมากที่สุดชนะ</div><div id="actionDock"></div><div id="itemDock"></div><div id="detailsDock"></div></section>
    </main>
    <div id="encounterOverlay"></div><div id="overlay"></div><div id="rollOverlay" aria-live="polite"></div><div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
